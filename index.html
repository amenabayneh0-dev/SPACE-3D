<html lang="en">
<head>

<style>
:root{
  --void:#02030a; --midnight:#070d24; --blue:#2f6bff; --violet:#7a4dff; --cyan:#35e0ff; --ink:#e8f0ff; --mute:#8d9bc4;
  --display:'Michroma','Eurostile','Arial Black',sans-serif; --body:'Manrope','Segoe UI',system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body)}
#root{position:relative;min-height:100svh;overflow-x:clip;
  background:radial-gradient(60% 55% at 78% 40%,rgba(122,77,255,.22),transparent 70%),radial-gradient(50% 50% at 12% 90%,rgba(47,107,255,.18),transparent 70%),linear-gradient(180deg,var(--void),var(--midnight) 70%,var(--void))}
.nebula{position:fixed;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:.3;filter:blur(40px);
  background:radial-gradient(40% 30% at 30% 40%,rgba(122,77,255,.25),transparent 70%),radial-gradient(35% 28% at 72% 70%,rgba(47,107,255,.2),transparent 70%);animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.06)}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0}
.ready canvas{animation:fade 3s ease forwards}
@keyframes fade{to{opacity:1}}
.cssplanet{position:absolute;right:8%;top:50%;width:min(46vw,520px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 30% 30%,#4aa3ff,#1a3a8c 45%,#050a24 75%);box-shadow:0 0 80px 6px rgba(74,140,255,.3)}
nav{position:fixed;z-index:20;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,5vw,64px)}
.logo{font-family:var(--display);font-size:.9rem;letter-spacing:.28em;display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.orb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--cyan),var(--violet) 60%,#1a1060);position:relative}
.orb::after{content:"";position:absolute;inset:-5px -9px;border:1px solid rgba(53,224,255,.55);border-radius:50%;transform:rotate(-22deg) scaleY(.35)}
.links{display:flex;gap:clamp(14px,3vw,40px)}
.links a{font-size:.72rem;letter-spacing:.22em;color:var(--mute);text-decoration:none;padding:6px 2px;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.links a:hover,.links a.on{color:var(--ink);border-color:var(--cyan)}
a:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.hero{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:110px clamp(18px,6vw,96px) 90px;pointer-events:none;max-width:780px}
.hero>*{pointer-events:auto}
h1,.tag,.sub,.btns,.scroll{opacity:0}
h1{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(2.6rem,8.4vw,7.2rem);line-height:.95;letter-spacing:.04em;
  background:linear-gradient(100deg,#fff 25%,#b9ecff 65%,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ready h1{animation:title 2.4s .4s cubic-bezier(.16,.84,.24,1) both}
@keyframes title{from{opacity:0;clip-path:inset(0 100% 0 0);letter-spacing:.3em;filter:blur(12px)}60%{filter:blur(0)}to{opacity:1;clip-path:inset(-10% -5% -10% 0);letter-spacing:.04em;filter:blur(0)}}
.tag{margin:34px 0 10px;font-family:var(--display);font-size:clamp(.8rem,1.6vw,1.1rem);letter-spacing:.34em;color:var(--cyan)}
.sub{margin:0 0 38px;max-width:30ch;font-size:clamp(1rem,1.6vw,1.2rem);font-weight:300;line-height:1.6;color:var(--mute)}
.ready .tag{animation:rise 1.4s 1.6s both cubic-bezier(.2,.8,.2,1)}
.ready .sub{animation:rise 1.4s 1.9s both cubic-bezier(.2,.8,.2,1)}
.ready .btns{animation:rise 1.4s 2.2s both cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btns{display:flex;flex-wrap:wrap;gap:16px}
.btn{position:relative;overflow:hidden;font:600 .72rem var(--body);letter-spacing:.24em;padding:17px 28px;border-radius:2px;cursor:pointer;color:var(--ink);
  transform:translate(var(--tx,0),var(--ty,0));transition:transform .25s ease-out,box-shadow .4s,border-color .4s}
.btn span{position:relative;z-index:2}
.btn::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .35s;background:radial-gradient(130px circle at var(--px,50%) var(--py,50%),rgba(255,255,255,.2),transparent 70%)}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}
.btn:hover::before{opacity:1}
.btn:hover::after{animation:shine .9s ease}
@keyframes shine{to{left:130%}}
.btn:active{transform:translate(var(--tx,0),var(--ty,0)) scale(.97)}
.btn.pri{border:1px solid rgba(53,224,255,.8);background:linear-gradient(120deg,rgba(53,224,255,.16),rgba(122,77,255,.28));box-shadow:0 0 18px rgba(53,224,255,.16)}

.btn.sec{border:1px solid rgba(141,155,196,.4);background:rgba(7,13,36,.4);backdrop-filter:blur(6px)}
.btn.sec:hover{border-color:rgba(232,240,255,.8)}
.hud{position:absolute;z-index:3;right:clamp(18px,5vw,64px);bottom:30px;text-align:right;font-size:.68rem;letter-spacing:.16em;color:var(--mute);line-height:1.9;pointer-events:none}
.hud b{display:block;color:var(--ink);font-family:var(--display);font-weight:400;font-size:.8rem;letter-spacing:.24em}
.scroll{position:absolute;z-index:3;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;font-size:.6rem;letter-spacing:.42em;color:var(--mute);pointer-events:none}
.scroll i{position:relative;width:1px;height:52px;background:rgba(141,155,196,.25);overflow:hidden}
.scroll i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:linear-gradient(transparent,var(--cyan));animation:run 2.6s 3.4s ease-in-out infinite}
.ready .scroll{animation:fade 1.6s 3s both}
@keyframes run{0%{top:-40%}70%,100%{top:100%}}
.toast{position:fixed;z-index:9;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(92vw,440px);padding:16px 20px;border:1px solid rgba(53,224,255,.45);background:rgba(5,9,26,.85);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;font-family:var(--display);font-weight:400;font-size:.75rem;letter-spacing:.2em;color:var(--cyan);margin-bottom:6px}
.toast span{font-size:.9rem;line-height:1.5}
@media (max-width:760px){
  .hero{justify-content:flex-end;padding-bottom:120px}
  .links a{font-size:.6rem;letter-spacing:.14em}.logo{letter-spacing:.16em;font-size:.75rem}
  .hud{display:none}
  .cssplanet{right:50%;top:26%;transform:translate(50%,-50%);width:62vw}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  canvas,h1,.tag,.sub,.btns,.scroll{opacity:1}
}

.scroll{pointer-events:auto;text-decoration:none}.scroll:hover{color:var(--ink)}

.logo{position:relative;z-index:2}
.burger{display:none;position:relative;z-index:2;width:44px;height:44px;background:none;border:0;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:6px}

.card{position:relative;height:100%;padding:30px 26px 26px;border:1px solid rgba(141,155,196,.2);border-radius:6px;background:linear-gradient(165deg,rgba(16,24,60,.6),rgba(4,7,22,.85));display:flex;flex-direction:column;align-items:center;text-align:center;transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .35s ease-out,border-color .4s,box-shadow .4s}

.pw{position:relative;width:var(--s);height:var(--s);margin-top:14px;flex:none}

.end{text-align:center;min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(2,3,10,.78);backdrop-filter:blur(8px);animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.panel{width:min(100%,440px);max-height:92svh;overflow:auto;padding:34px 28px 28px;text-align:center;border:1px solid rgba(53,224,255,.35);border-radius:6px;background:linear-gradient(165deg,#10183c,#04071a);display:flex;flex-direction:column;align-items:center}

.js .rv{opacity:0;transform:translateY(30px);transition:opacity 1.1s var(--d,0s) cubic-bezier(.2,.8,.2,1),transform 1.1s var(--d,0s) cubic-bezier(.2,.8,.2,1)}

@media (max-width:760px){
  .burger{display:flex}
  .links{position:fixed;inset:0;z-index:1;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:rgba(2,3,10,.96);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script>
const { useEffect, useRef, useState } = React;
const h = React.createElement;
let RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SMALL = innerWidth < 760;
/* Settings: graphics quality, reduced motion, sound. Saved on this device only. */
const CFG = Object.assign({ q: SMALL || (navigator.hardwareConcurrency || 8) <= 4 ? 'medium' : 'high', rm: RM, snd: false, vol: .5, bh: 'realism' }, (() => { try { return JSON.parse(localStorage.getItem('space3d-cfg')) || {}; } catch (e) { return {}; } })());

const QS = { low: { px: 1, tex: 192, st: .3, fx: 0 }, medium: { px: 1.5, tex: 320, st: .7, fx: 1 }, high: { px: 2, tex: 512, st: 1.4, fx: 2 } };
const SND = {};
function sound() { /* quiet ambient hum, only ever started from a click */
  if (CFG.snd) {
    if (!SND.ctx) {
      const c = SND.ctx = new (window.AudioContext || window.webkitAudioContext)(), g = SND.g = c.createGain(), f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;

}

/* ---------- procedural noise ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const cl01 = v => Math.max(0, Math.min(1, v));
const hash = (x, y, z) => { let n = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177); n = Math.imul(n ^ (n >>> 13), 1103515245); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), f = v => v * v * (3 - 2 * v);
  const u = f(x - xi), v = f(y - yi), w = f(z - zi), c = (a, b, d) => hash(xi + a, yi + b, zi + d);
  return lerp(lerp(lerp(c(0,0,0), c(1,0,0), u), lerp(c(0,1,0), c(1,1,0), u), v),
              lerp(lerp(c(0,0,1), c(1,0,1), u), lerp(c(0,1,1), c(1,1,1), u), v), w);
}
function fbm(x, y, z, o) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.03; a *= .5; } return s; }
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];

/* One pass builds colour, bump, roughness and cloud maps for the planet */
function makeMaps(w, hh) {
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = hh; const x = c.getContext('2d'); return { c, x, d: x.createImageData(w, hh) }; };
  const S = mk(), B = mk(), R = mk(), C = mk();
  const put = (o, k, r, g, b, a) => { const d = o.d.data; d[k] = r; d[k+1] = g; d[k+2] = b; d[k+3] = a; };
  for (let j = 0; j < hh; j++) for (let i = 0; i < w; i++) {
    const lon = i / w * 6.2832, lat = (j / hh - .5) * 3.1416, cl = Math.cos(lat);
    const x = cl * Math.cos(lon), y = Math.sin(lat), z = cl * Math.sin(lon), k = (j * w + i) * 4;
    const ca = cl01((fbm(x * 2.2 + 9, y * 2.8, z * 2.2, 5) - .5) * 3.4);
    const sh = cl01((fbm(x * 2.2 + 9.07, y * 2.8 - .08, z * 2.2 + .05, 4) - .5) * 3.4);
    const ht = fbm(x * 1.7 + 3, y * 1.7, z * 1.7, 6), sea = .53;
    const ice = Math.abs(y) > .6 ? Math.abs(y) + (fbm(x * 4, y * 4, z * 4, 3) - .5) * .35 : 0;
    let col, hv, rg;
    if (ice > .86) { col = mix([205,225,245], [255,255,255], cl01((ice - .86) * 6)); hv = 140; rg = 150; }
    else if (ht < sea) { col = mix([3,9,40], [20,92,158], Math.pow(ht / sea, 2.2)); hv = 40; rg = 55; }
    else {
      const e = (ht - sea) / (1 - sea), m = fbm(x * 3.4, y * 3.4, z * 3.4, 3), dt = .8 + .4 * vnoise(x * 26, y * 26, z * 26);
      col = e < .05 ? mix([196,184,140], [64,110,84], e / .05) : e < .4 ? mix([48,98,70], [112,98,70], cl01(m * 1.2)) : mix([118,104,84], [226,228,236], cl01((e - .4) * 2.4));
      col = col.map(v => v * dt); hv = 70 + e * 185; rg = 225;
    }
    const s = 1 - .32 * sh;
    put(S, k, col[0] * s, col[1] * s, col[2] * s, 255); put(B, k, hv, hv, hv, 255); put(R, k, rg, rg, rg, 255); put(C, k, 245, 250, 255, ca * 235);
  }

}

/* Blue and violet nebula, composed to sit behind the planet */
function nebulaTex(w, hh) {
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const x = c.getContext('2d'), img = x.createImageData(w, hh), g = (u, v, cx, cy, sx, sy) => Math.exp(-(((u - cx) / sx) ** 2 + ((v - cy) / sy) ** 2));
  for (let j = 0; j < hh; j++) for (let i = 0; i < w; i++) {
    const u = i / w, v = j / hh, q = fbm(u * 3.2, v * 1.8, 1.3, 4), d = fbm(u * 3.2 + q * 1.8, v * 1.8 + q * 1.2, 4.7, 5);
    const mv = g(u, v, .74, .4, .26, .34), mb = .8 * g(u, v, .16, .82, .3, .3), mc = .45 * g(u, v, .5, .02, .3, .18), ws = mv + mb + mc + 1e-4;

}

/* Depth-layered stars */
function sprite() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, '#fff'); r.addColorStop(.25, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
function field(n, r0, r1, size, opacity, map) {

    pos.set([r * s * Math.cos(a), r * u, r * s * Math.sin(a)], i * 3); col.set(pal[i % 4].map(v => v * b), i * 3);

}

/* Atmosphere shader: glow hugs the limb and is brighter on the sunlit side */
const atm = (col, side, body) => new THREE.ShaderMaterial({
  uniforms: { col: { value: new THREE.Color(col) } }, transparent: true, side, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: 'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',

});

function Scene({ api, onFail, onReady }) {

      const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.525, 72, 72), new THREE.MeshStandardMaterial({ map: T.cloud, transparent: true, depthWrite: false, roughness: 1, opacity: .92 }));
      const halo = new THREE.Mesh(new THREE.SphereGeometry(1.72, 48, 48), atm(0x4a8cff, THREE.BackSide, 'pow(smoothstep(0.,.5,d),2.6)*lit*.95'));
      const rim = new THREE.Mesh(new THREE.SphereGeometry(1.54, 48, 48), atm(0x6ab8ff, THREE.FrontSide, 'pow(1.-d,3.6)*lit*.8'));
      const moon = new THREE.Mesh(new THREE.SphereGeometry(.17, 24, 24), new THREE.MeshStandardMaterial({ color: 0x9aa4c4, roughness: .95 }));
      const orbit = new THREE.Group(); moon.position.set(2.7, .35, 0); orbit.add(moon); orbit.rotation.z = .3;
      const pg = new THREE.Group(); pg.rotation.z = .38; pg.add(planet, clouds, halo, rim); scene.add(pg, orbit);

      scene.add(new THREE.AmbientLight(0x1a2a66, .5));
      const sun = new THREE.DirectionalLight(0xfff1dd, 2.5); sun.position.set(-5, 2.5, 3.5); scene.add(sun);
      const back = new THREE.PointLight(0x7a4dff, 40, 30); back.position.set(5, -1, -3); scene.add(back);

      const neb = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: nebulaTex(SMALL ? 256 : 448, SMALL ? 128 : 224), transparent: true, depthWrite: false }));
      neb.position.z = -60; scene.add(neb);

      const dot = sprite(), k = SMALL ? .45 : 1;
      const layers = [[field(2600 * k, 95, 125, .26, .8, dot), .2], [field(1400 * k, 60, 95, .3, .85, dot), .5], [field(700 * k, 35, 60, .32, .7, dot), .9]];
      const bright = field(60 * k, 30, 70, .8, .85, dot), dust = field(160 * k, 6, 16, .2, .3, dot);
      layers.forEach(l => scene.add(l[0])); scene.add(bright, dust);

      const resize = () => {

        Object.assign(base, { x: wide ? 1.9 : 0, y: wide ? 0 : 1.05, s: wide ? 1 : .7, w: wide ? 1 : 0 });

          bright.material.opacity = .7 + .15 * Math.sin(t * 1.2);
        }
        layers.forEach(l => l[0].position.x = -mx * l[1]); neb.position.x = -mx * 2;
        cam.position.x += (mx * .45 + (RM ? 0 : Math.sin(t * .2) * .12) - cam.position.x) * .04;
        cam.position.y += (-my * .3 + (RM ? 0 : Math.cos(t * .17) * .08) - cam.position.y) * .04;

}

  { n: 'MERCURY', a: '#cfc9c0', b: '#7c766f', c: '#24211e', fact: 'Surface temperatures swing from about 430 °C by day to −180 °C at night.', d: '4,879 km', day: '59 Earth days', moons: '0', au: '0.39 AU' },
  { n: 'VENUS', a: '#f4dea8', b: '#c9904a', c: '#3f2410', bands: 'repeating-linear-gradient(170deg,rgba(255,255,255,.3) 0 9px,rgba(80,40,0,.3) 9px 22px)', fact: 'A single day on Venus lasts longer than its whole year.', d: '12,104 km', day: '243 Earth days', moons: '0', au: '0.72 AU' },
  { n: 'EARTH', a: '#8fd0ff', b: '#1c58b8', c: '#06163a', bands: 'radial-gradient(40% 30% at 35% 40%,rgba(70,150,90,.9),transparent),radial-gradient(30% 25% at 70% 65%,rgba(70,150,90,.8),transparent)', fact: 'About 71% of its surface is covered by liquid water.', d: '12,742 km', day: '24 hours', moons: '1', au: '1.00 AU' },
  { n: 'MARS', a: '#f0a07a', b: '#b4492a', c: '#34100a', fact: 'Olympus Mons stands about 22 km high, nearly three times Everest.', d: '6,779 km', day: '24.6 hours', moons: '2', au: '1.52 AU' },
  { n: 'JUPITER', a: '#ecd2ae', b: '#b57a4a', c: '#35200f', bands: 'repeating-linear-gradient(0deg,rgba(255,255,255,.4) 0 8px,rgba(90,40,10,.45) 8px 20px)', fact: 'Its Great Red Spot is a storm wider than Earth that has raged for centuries.', d: '139,820 km', day: '9.9 hours', moons: '95+', au: '5.20 AU' },
  { n: 'SATURN', a: '#f5e4b4', b: '#c9a766', c: '#3b2e18', ring: 1, bands: 'repeating-linear-gradient(0deg,rgba(255,255,255,.3) 0 7px,rgba(90,60,10,.3) 7px 16px)', fact: 'Saturn is less dense than water, so it would float in a big enough bathtub.', d: '116,460 km', day: '10.7 hours', moons: '270+', au: '9.58 AU' },
  { n: 'URANUS', a: '#c8f5f5', b: '#6cc3cf', c: '#103a42', fact: 'It spins on its side, tilted about 98 degrees from upright.', d: '50,724 km', day: '17.2 hours', moons: '29', au: '19.2 AU' },
  { n: 'NEPTUNE', a: '#86abff', b: '#2c4fd1', c: '#090f4a', bands: 'repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 10px,rgba(0,0,60,.3) 10px 24px)', fact: 'Its winds exceed 2,000 km/h, the fastest in the solar system.', d: '49,244 km', day: '16.1 hours', moons: '16', au: '30.1 AU' }
];
function Sphere({ p, s }) {
  return h('div', { className: 'pw', style: { '--s': s + 'px', '--a': p.a, '--b': p.b, '--c': p.c, '--bands': p.bands || 'none' } },
    p.ring && h('i', { className: 'ring' }), h('div', { className: 'sph' }), p.ring && h('i', { className: 'ring f' }));
}

      h('p', { className: 'lead rv', style: d(.1) }, 'Everything we can observe began in one hot, dense moment. Since then space has stretched, stars have lit and burned out, and the atoms they forged became planets, oceans and people.'),

        h('div', { key: n, className: 'fact rv', style: d(i * .12) }, h('b', null, n), h('span', null, t))))),
    h(SolarSection), h(UniverseSection),

}

/* Premium button: cursor spotlight, light sweep, slight magnetic pull */
function Btn({ cls, onClick, children }) {
  const mv = e => {
    const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, s = e.currentTarget.style;
    s.setProperty('--px', x + 'px'); s.setProperty('--py', y + 'px');
    if (!RM) { s.setProperty('--tx', (x / r.width - .5) * 8 + 'px'); s.setProperty('--ty', (y / r.height - .5) * 6 + 'px'); }
  };
  const lv = e => { e.currentTarget.style.setProperty('--tx', '0px'); e.currentTarget.style.setProperty('--ty', '0px'); };
  return h('button', { className: 'btn ' + cls, onClick, onPointerMove: mv, onPointerLeave: lv }, h('span', null, children));
}

  const show = (t, b) => { setToast({ t, b }); clearTimeout(timer.current); timer.current = setTimeout(() => setToast(null), 5200); };
  api.current.pick = () => { api.current.fly && api.current.fly(); show('AETHRA-7', 'An ocean world wrapped in a thick blue atmosphere. Its single moon completes an orbit every 28 days.'); };

    h('nav', { className: scrolled ? 'scrolled' : '' },
